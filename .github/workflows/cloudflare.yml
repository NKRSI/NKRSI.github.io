name: Deploy Jekyll site to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "cloudflare"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@4a9ddd6f338a97768b8006bf671dfbad383215f4
        with:
          ruby-version: '3.4'
          bundler-cache: true
          cache-version: 0
      - name: Generate runtime config from environment
        env:
          DISCORD_INVITE_URL: ${{ vars.DISCORD_INVITE_URL }}
        run: |
          printf 'discord_url: "%s"\n' "${DISCORD_INVITE_URL}" > _config_env.yml
          cat _config_env.yml
      - name: Build with Jekyll
        run: bundle exec jekyll build --config _config.yml,_config_env.yml
        env:
          JEKYLL_ENV: production
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
