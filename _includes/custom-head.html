<style>
  /* Make header favicon visible in dark mode. */
  html[data-theme="dark"] .site-header .site-brand .site-favicon {
    filter: brightness(0) invert(1);
  }
</style>
{%- if site.redirect_to and site.redirect_to != "" %}
{%- assign redirect_base = site.redirect_to %}
<meta http-equiv="refresh" content="0; url={{ redirect_base }}{{ page.url }}">
<script>
  // Domain moved: send visitors to the same path on the new domain.
  window.location.replace({{ redirect_base | jsonify }} + window.location.pathname + window.location.search + window.location.hash);
</script>
{%- endif %}
